[project]
name = "talentvisor"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "sqlmodel",
    "faster-whisper",
    "spacy",
    "pt_core_news_md",
    "openai",
    "weasyprint",
    "av<19",  # faster-whisper 1.2.1 passes metadata_errors to av.open; av 19 removed it
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.uv.sources]
pt_core_news_md = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_md-3.8.0/pt_core_news_md-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
