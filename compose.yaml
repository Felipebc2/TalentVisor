services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"  # no login (D-009): never expose on the LAN
    volumes:
      # Explicit mounts, never `.`: keeps .env out of the container filesystem (keys only via env_file).
      - ./talentvisor:/app/talentvisor
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./docs:/app/docs:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./CLAUDE.md:/app/CLAUDE.md:ro
      - ./Makefile:/app/Makefile:ro  # read by scripts/docs_links.py (NF-07 target check)
      - ./.gitignore:/app/.gitignore:ro  # read by scripts/docs_links.py (NF-03: .env ignored)
      - tv-data:/app/data
    command: uvicorn talentvisor.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  tv-data:
