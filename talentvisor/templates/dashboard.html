{% extends "base.html" %}
{% from "_macros.html" import status_badge %}
{% block title %}Painel do recrutador · TalentVisor{% endblock %}
{% block content %}
<h1>Painel do recrutador</h1>
{% if rows %}
<figure>
  <table>
    <thead><tr><th>Código</th><th>Status</th><th>Enviado</th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr><td><code>{{ r.code }}</code></td><td>{{ status_badge(r.status) }}</td><td>{{ r.sent }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</figure>
{% else %}
<p>Nenhuma candidatura ainda. <a href="/upload">Enviar candidatura</a></p>
{% endif %}
{% endblock %}
