{% from "_macros.html" import stepper, status_badge %}
<div id="progress" aria-live="polite"{% if c.status in PROCESSING %} hx-get="/candidate/{{ c.id }}/status" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %}>
  <h2>Processando {{ status_badge(c.status) }}</h2>
  {{ stepper(c.status) }}
</div>
